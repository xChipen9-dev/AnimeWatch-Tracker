<section class="discover">

  <h1>Modo Descubrir</h1>
  <p class="subtitle">Desliza entre animes aleatorios y encuentra nuevas joyas</p>

  <div class="loading" *ngIf="loading">Cargando anime...</div>

  <div class="error" *ngIf="error">{{ error }}</div>

  <div class="card" *ngIf="anime && !loading">

    <img class="cover" [src]="anime.images.jpg.large_image_url" />

    <h2>{{ anime.title }}</h2>
    <p class="score">⭐ {{ anime.score }}</p>

    <p class="synopsis">
      {{ anime.synopsis || 'Sin sinopsis disponible.' }}
    </p>

    <div class="buttons">
      <button class="skip" (click)="skipAnime()">❌ Descartar</button>
      <button class="like" (click)="likeAnime()">❤️ Me gusta</button>
    </div>

  </div>

</section>
